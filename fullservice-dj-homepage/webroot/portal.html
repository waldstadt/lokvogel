<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kunden-Backoffice – lauschgift.net</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%23ff6f5b'%3E%3Crect x='3' y='11' width='5' height='10' rx='2.5'/%3E%3Crect x='10' y='5' width='5' height='22' rx='2.5'/%3E%3Crect x='17' y='9' width='5' height='14' rx='2.5'/%3E%3Crect x='24' y='13' width='5' height='6' rx='2.5'/%3E%3C/g%3E%3C/svg%3E">
<link href="fonts.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.ic{width:17px;height:17px;vertical-align:-3px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block}

:root{--bg:#0f1012;--card:#1a1c21;--card2:#212429;--line:#282b32;--acc:#ff6f5b;--acc2:#ff8d7c;
--txt:#f2f0ec;--mut:#a3a29b;--mut2:#8f8e88;--grn:#5aa05a}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
a{color:var(--acc);text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px}
.logo{display:flex;align-items:center;gap:9px;margin-bottom:36px}
.logo svg{width:24px;height:24px}
.logo b{font-family:'Space Grotesk',sans-serif;font-size:19px}
.logo b i{font-style:normal;color:var(--acc)}
/* Kundeninhalte können sehr lange Wörter/URLs enthalten - ohne Umbruchregel
   schiebt ein einziger Wert die ganze Seite in die Breite. */
.card,.sub,.items td{overflow-wrap:anywhere}
.card{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:28px;margin-bottom:18px}
.kicker{font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:8px}
.kicker::before{content:"";display:inline-block;width:18px;height:2px;background:var(--acc);vertical-align:middle;margin-right:8px}
h1{font-size:clamp(24px,5vw,32px);margin-bottom:6px}
.sub{color:var(--mut);font-size:14px}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px;font-weight:600}
input,select,textarea{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:15px;outline:0;border-radius:4px}
::placeholder{color:var(--mut)}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:100px;resize:vertical}
.btn{display:inline-block;background:var(--acc);color:#16110f;padding:13px 26px;font-size:13px;font-weight:600;letter-spacing:.03em;border:none;border-radius:4px;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:background .2s}
.btn:hover{background:var(--acc2)}
.btn.g{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.g:hover{border-color:var(--acc);color:var(--acc)}
.btn.green{background:#4f9a4f;color:#0c150c}
.btn:disabled{opacity:.5;cursor:default}
.msg{padding:14px 16px;font-size:14px;border:1px solid;border-radius:4px;margin:14px 0;display:none}
.msg.ok{display:block;border-color:#3d6b3d;background:rgba(60,120,60,.12);color:#9fd49f}
.msg.err{display:block;border-color:#7a3535;background:rgba(150,60,60,.12);color:#e0a0a0}

/* Angebots-Tabelle */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td{padding:11px 8px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
.subrow td{padding:1px 8px;border-bottom:none;font-size:11.5px}
.grouphead td{padding-top:9px;padding-bottom:1px}
.groupfoot td{padding-top:2px;padding-bottom:7px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{text-align:right}
.pos-desc{position:relative;cursor:default}
.pos-desc .info{display:inline-block;margin-left:6px;width:17px;height:17px;line-height:17px;text-align:center;border-radius:50%;background:rgba(255,111,91,.15);color:var(--acc);font-size:11px;font-weight:700;cursor:help}
.tip{display:none;position:absolute;left:0;top:100%;z-index:20;background:var(--card2);border:1px solid var(--acc);border-radius:4px;padding:12px 14px;font-size:13px;color:var(--txt);max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.5);margin-top:4px}
.pos-desc:hover .tip,.pos-desc.open .tip{display:block}
.totals td{border-bottom:none;padding:5px 8px}
.totals .grand{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--acc)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.status-b{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 12px;border-radius:4px;border:1px solid var(--grn);color:var(--grn)}
.hint{font-size:12px;color:var(--mut2);margin-top:14px}
footer{font-size:12px;color:var(--mut2);margin-top:34px;text-align:center}
.hidden{display:none}
.fade{animation:f .5s ease}@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.ups{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
.up{background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:18px}
.up h4{font-size:15px;margin-bottom:5px}
.up p{font-size:13px;color:var(--mut);margin-bottom:10px}
.up .upp{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--acc);margin-bottom:10px}
.up button{font-size:12px;padding:8px 14px}
.up.asked{border-color:var(--grn)}
#printArea{display:none}
@media print{
  html,body{background:#fff!important}
  body>.wrap{display:none!important}
  #printArea{display:block!important;background:#fff;color:#111}
}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--mut);margin:14px 0}
.chk input{width:auto;margin-top:3px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <svg viewBox="0 0 32 32"><g fill="var(--acc)"><rect x="3" y="11" width="5" height="10" rx="2.5"/><rect x="10" y="5" width="5" height="22" rx="2.5"/><rect x="17" y="9" width="5" height="14" rx="2.5"/><rect x="24" y="13" width="5" height="6" rx="2.5"/></g></svg>
    <b>lauschgift<i>.</i></b>&nbsp;<span class="sub">Kunden-Backoffice</span>
  </div>
  <div id="app"><div class="card"><div class="sub">Wird geladen …</div></div></div>
  <footer id="foot"></footer>
</div>
<div id="printArea"></div>

<script>
var API='api.php';
var qs=new URLSearchParams(location.search);
var OFFER=qs.get('a'),FORM=qs.get('f'),MV=qs.get('mv'),INVITE=qs.get('einladung');
var REGISTER=qs.get('register'),PREFILL_EMAIL=qs.get('email')||'',PREFILL_NAME=qs.get('name')||'';
var PLZ=sessionStorage.getItem('portal_plz')||'';
/* Anfuehrungszeichen und Apostrophe mitmaskieren: innerHTML alleine ersetzt nur & < >,
   damit liesse sich aus einem Attribut ausbrechen (style, onfocus und so weiter). */
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);
  return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
/* Nur echte Web-Adressen verlinken - javascript: im Feld waere sonst ausfuehrbar. */
function safeUrl(u){u=String(u==null?'':u).trim();return /^https?:\/\//i.test(u)?u:''}
function euro(n){return (Number(n)||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function dt(d){if(!d)return '–';return new Date(d).toLocaleDateString('de-DE')}
function rentalPeriodLabel(from,to){
  if(!from)return '';
  if(!to||to<=from)return 'Mietzeitraum am '+dt(from);
  return 'Mietzeitraum vom '+dt(from)+' bis '+dt(to);
}
function app(html){document.getElementById('app').innerHTML='<div class="fade">'+html+'</div>'}
function showMsg(id,cls,txt){var m=document.getElementById(id);m.className='msg '+cls;m.textContent=txt}

/* ===================== ANGEBOT ===================== */
var DOC=null;
function loadOffer(){
  fetch(API+'/portal/offer/'+OFFER+'?plz='+encodeURIComponent(PLZ))
    .then(function(r){return r.json().then(function(j){return {s:r.status,j:j}})})
    .then(function(res){
      if(res.s===401){renderPlzGate();return}
      if(res.s!==200){app('<div class="card"><h2>'+(res.s===404?'Link nicht gefunden':'Das klappt gerade nicht')+'</h2><p class="sub" style="margin-top:8px">'+esc(res.j.error||'Bitte prüft den Link oder meldet euch direkt bei mir.')+'</p></div>');return}
      DOC=res.j;renderOffer();
    }).catch(function(){app('<div class="card"><p class="sub">Verbindungsfehler – bitte später erneut versuchen.</p></div>')});
}
function renderPlzGate(){
  app('<div class="card"><div class="kicker">Euer Angebot</div><h1>Kurze Sicherheitsfrage</h1>'+
    '<p class="sub">Zum Schutz eurer Daten: Gebt bitte die Postleitzahl eurer Rechnungsadresse ein.</p>'+
    '<div class="msg err" id="gateMsg" style="display:'+(PLZ?'block':'none')+'">Die Postleitzahl passt leider nicht – bitte erneut versuchen.</div>'+
    '<label for="plzIn">Postleitzahl</label><input id="plzIn" inputmode="numeric" maxlength="10" placeholder="z. B. 58675">'+
    '<div style="margin-top:16px"><button class="btn" onclick="submitPlz()">Angebot öffnen</button></div></div>');
  var inp=document.getElementById('plzIn');
  inp.focus();
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')submitPlz()});
}
function submitPlz(){
  PLZ=document.getElementById('plzIn').value.trim();
  sessionStorage.setItem('portal_plz',PLZ);
  loadOffer();
}
var TYPE_NAME={angebot:'Angebot',rechnung:'Rechnung',abschlag:'Abschlagsrechnung',schluss:'Schlussrechnung',lieferschein:'Lieferschein'};
function lineTotal(it){
  if(it.is_header)return 0; /* reine Kopfzeile (Artikel/Stückzahl/Tagespreis) - Summe steckt in den Unterpositionen */
  var g=(Number(it.qty)||0)*(Number(it.unit_price)||0);
  var dd=Number(it.discount_value)||0;
  if(!dd)return g;
  return it.discount_type==='eur'?Math.max(0,g-dd):g*(1-Math.min(100,dd)/100);
}
/* Gruppiert Haupt-/Unterpositionen (Miettage-Rabattstaffel) anhand von is_header/group_pos -
   siehe admin.html equipTierLineItems()/saveDoc() für die Erzeugung. */
function groupDocItems(items){
  var headerAt={};
  items.forEach(function(it,i){if(it.is_header)headerAt[it.pos]=i});
  var subsOf={};
  items.forEach(function(it,i){
    if(it.group_pos!=null&&headerAt[it.group_pos]!=null)(subsOf[it.group_pos]=subsOf[it.group_pos]||[]).push(i);
  });
  var consumed={};
  Object.keys(subsOf).forEach(function(gp){subsOf[gp].forEach(function(i){consumed[i]=true})});
  var groups=[];
  items.forEach(function(it,i){
    if(consumed[i])return;
    groups.push({main:i,subs:it.is_header?(subsOf[it.pos]||[]):[]});
  });
  return groups;
}
function groupTotal(items,g){return g.subs.reduce(function(s,i){return s+lineTotal(items[i])},lineTotal(items[g.main]))}
/* Bei einer Rabattstaffel-Unterposition steckt in it.qty Stückzahl × Tage dieser Stufe (für die
   korrekte Summe). Angezeigt wird die tatsächliche Stückzahl - es bleiben ja immer gleich viele
   Geräte, egal wie viele Miettage - die Tage stehen in der Einheit ("Stk. (N Tage)"). */
function subMenge(it){
  var m=(it.unit||'').match(/\((\d+) Tage\)/);
  if(!m)return it.qty;
  var days=Number(m[1]);
  return days?Math.round((it.qty/days)*100)/100:it.qty;
}
function docRowsHtml(items,f){
  var groups=groupDocItems(items);
  return groups.map(function(g,gi){
    var it=items[g.main],label=String(gi+1);
    if(!g.subs.length){
      var info=it.note?'<span class="info">i</span><span class="tip">'+esc(it.note)+'</span>':'';
      var rab=Number(it.discount_value)?'<div style="font-size:11px;color:var(--grn)">Rabatt: −'+(it.discount_type==='eur'?euro(it.discount_value*f):Number(it.discount_value)+' %')+'</div>':'';
      return '<tr><td class="num">'+label+'</td>'+
        '<td class="pos-desc" onclick="this.classList.toggle(\'open\')">'+esc(it.description)+info+rab+'</td>'+
        '<td class="num">'+Number(it.qty)+' '+esc(it.unit||'')+'</td>'+
        '<td class="num">'+euro(lineTotal(it)*f)+'</td></tr>';
    }
    var head='<tr class="grouphead"><td class="num" style="font-weight:700">'+label+'</td>'+
      '<td style="font-weight:700">'+esc(it.description)+
      '<div style="font-size:10.5px;color:var(--mut2);font-weight:400">'+it.qty+' Stk. · Stückpreis '+euro(it.unit_price*f)+' / Tag</div></td>'+
      '<td class="num"></td><td class="num"></td></tr>';
    var subs=g.subs.map(function(si,k){
      var sit=items[si];
      var info=sit.note?'<span class="info">i</span><span class="tip">'+esc(sit.note)+'</span>':'';
      return '<tr class="subrow" style="color:var(--mut)"><td class="num">'+label+'.'+String.fromCharCode(65+k)+'</td>'+
        '<td class="pos-desc" style="padding-left:18px" onclick="this.classList.toggle(\'open\')">'+esc(sit.description)+info+'</td>'+
        '<td class="num">'+subMenge(sit)+' '+esc(sit.unit||'')+'</td>'+
        '<td class="num">'+euro(lineTotal(sit)*f)+'</td></tr>';
    }).join('');
    var foot='<tr class="groupfoot"><td></td><td colspan="2" style="text-align:right;font-weight:700;font-size:12.5px">Gesamtsumme der Position</td>'+
      '<td class="num" style="font-weight:700;font-size:12.5px">'+euro(groupTotal(items,g)*f)+'</td></tr>';
    return head+subs+foot;
  }).join('');
}
function renderOffer(){
  var d=DOC.doc,items=DOC.items;
  var brutto=d.price_mode==='brutto'&&!d.is_small_business;
  var f=brutto?1:(Number(d.tax_rate)?1/(1+Number(d.tax_rate)/100):1);
  document.getElementById('foot').innerHTML=esc(DOC.company.name||'DJ Lauschgift')+' · '+esc(DOC.company.owner||'')+
    (DOC.company.phone?' · '+esc(DOC.company.phone):'');
  var rows=docRowsHtml(items,f);
  var totals='';
  var sub=items.reduce(function(s,it){return s+lineTotal(it)},0);
  var dv=Number(d.discount_value)||0;
  var disc=dv?(d.discount_type==='eur'?Math.min(sub,dv):sub*Math.min(100,dv)/100):0;
  if(disc)totals+='<tr class="totals"><td colspan="3" class="num">Zwischensumme</td><td class="num">'+euro(sub*f)+'</td></tr>'+
    '<tr class="totals"><td colspan="3" class="num" style="color:var(--grn)">Euer Rabatt'+(d.discount_type==='pct'?' ('+dv+' %)':'')+'</td><td class="num" style="color:var(--grn)">−'+euro(disc*f)+'</td></tr>';
  if(brutto){
    totals+='<tr class="totals"><td colspan="3" class="num"><b>Gesamt inkl. USt.</b></td><td class="num grand">'+euro(d.total_gross)+'</td></tr>'+
      '<tr class="totals"><td colspan="3" class="num" style="color:var(--mut2)">darin enthaltene USt. '+Number(d.tax_rate)+' %</td><td class="num" style="color:var(--mut2)">'+euro(d.total_tax)+'</td></tr>';
  }else{
    totals+='<tr class="totals"><td colspan="3" class="num">Netto</td><td class="num">'+euro(d.total_net)+'</td></tr>';
    if(!d.is_small_business)totals+='<tr class="totals"><td colspan="3" class="num">USt. '+Number(d.tax_rate)+' %</td><td class="num">'+euro(d.total_tax)+'</td></tr>';
    totals+='<tr class="totals"><td colspan="3" class="num"><b>Gesamt</b></td><td class="num grand">'+euro(d.total_gross)+'</td></tr>';
  }
  /* Nur ein Angebot wird angenommen oder abgelehnt. Bei einer Rechnung gehört dorthin
     kein "unverbindlich"-Text und kein Unterschriftsfeld, sondern nur der Nachrichtenweg. */
  var istAngebot=d.doc_type==='angebot';
  var decided=!istAngebot||['angenommen','abgelehnt','bezahlt','storniert'].indexOf(d.status)>=0;
  var statusLine=d.status==='angenommen'?'<span class="status-b">✓ Angenommen – danke euch!</span>':
    (d.status==='abgelehnt'?'<span class="status-b" style="border-color:var(--mut2);color:var(--mut)">Abgelehnt</span>':'');
  app(
    '<div class="card"><div class="kicker">'+(TYPE_NAME[d.doc_type]||'Dokument')+' '+esc(d.number)+'</div>'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">'+
    '<div><h1>Hallo '+esc(DOC.customer)+'!</h1>'+
    '<p class="sub">vom '+dt(d.doc_date)+(d.valid_until?' · gültig bis '+dt(d.valid_until):'')+(rentalPeriodLabel(d.rental_from,d.rental_to)?' · '+rentalPeriodLabel(d.rental_from,d.rental_to):'')+'</p></div>'+
    '<button class="btn g" onclick="downloadPdf()"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Als PDF speichern</button></div>'+
    (statusLine?'<div style="margin-top:12px">'+statusLine+'</div>':'')+
    (d.intro_text?'<p style="margin-top:16px;white-space:pre-wrap">'+esc(d.intro_text)+'</p>':'')+
    '</div>'+
    '<div class="card"><table><thead><tr><th class="num">#</th><th>Leistung</th><th class="num">Menge</th><th class="num">Preis</th></tr></thead>'+
    '<tbody>'+rows+'</tbody><tfoot>'+totals+'</tfoot></table>'+
    '<p class="hint">Tipp: Tippt auf eine Position mit dem <b style="color:var(--acc)">i</b> – dort erkläre ich, was genau dahintersteckt.</p></div>'+
    ((DOC.upsells&&DOC.upsells.length&&!decided)?
      '<div class="card"><h3 style="margin-bottom:4px">Noch eine Schippe drauf?</h3>'+
      '<p class="sub">Falls ihr noch überlegt: Diese Extras werden oft dazugebucht. Klickt an, was euch interessiert – ich sage euch, was es für euren Termin kostet.</p>'+
      '<div class="ups">'+DOC.upsells.map(function(u){
        return '<div class="up" id="up-'+u.id+'"><h4>'+esc(u.title)+'</h4><p>'+esc(u.description||'')+'</p>'+
        '<div class="upp">+ '+euro(u.price_net)+' <small style="font-weight:400;color:var(--mut2)">inkl. USt.</small></div>'+
        '<button class="btn g" onclick="askUpsell(\''+u.id+'\',this)">Interessiert mich</button></div>';
      }).join('')+'</div></div>':'')+
    (d.outro_text?'<div class="card"><p style="white-space:pre-wrap" class="sub">'+esc(d.outro_text)+'</p></div>':'')+
    (function(){
      var rv=DOC.reviews||{};if(!rv.google_url)return '';
      return '<div class="card" style="padding:16px 24px;font-size:13px;color:var(--mut)">'+
        (rv.tagline?'<b style="color:var(--txt)">'+esc(rv.tagline)+'</b> – ':'')+
        'Ihr wollt wissen, wie andere ihre Feier mit mir erlebt haben? '+
        '<a href="'+esc(safeUrl(rv.google_url))+'" target="_blank" rel="noopener noreferrer">★ Google-Bewertungen ↗</a></div>';
    })()+
    '<div class="card" id="actionCard">'+
    (decided?
      '<p class="sub">'+(!istAngebot?'Fragen zur Rechnung? Schreibt mir einfach hier, ich melde mich:'
        :(d.status==='angenommen'?'Ich melde mich zeitnah bei euch mit den nächsten Schritten. Wenn euch noch etwas einfällt, schreibt mir hier:':'Ihr habt Fragen oder wollt doch nochmal sprechen? Schreibt mir gerne:'))+'</p>'+
      '<div class="msg" id="aMsg"></div>'+
      '<label for="cmt">Nachricht</label><textarea id="cmt"></textarea>'+
      '<div class="actions" style="margin-top:12px"><button class="btn g" onclick="act(\'comment\')"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> Nachricht senden</button></div>'
      :
      '<h3 style="margin-bottom:6px">Wie möchtet ihr weitermachen?</h3>'+
      '<p class="sub">Alles unverbindlich bis zur Annahme – und Fragen kosten nichts.</p>'+
      '<div class="msg" id="aMsg"></div>'+
      '<div class="actions" style="margin-top:16px">'+
      '<button class="btn green" onclick="confirmAccept()">✓ Angebot annehmen</button>'+

function toggle(id){['accBox','cmtBox','cbBox','declBox'].forEach(function(x){
  var el=document.getElementById(x);if(!el)return;
  el.classList.toggle('hidden',x!==id||!el.classList.contains('hidden'))})}
var accDirty=false;
function confirmAccept(){
  toggle('accBox');
  if(!document.getElementById('accBox').classList.contains('hidden'))accInit();
}
function accInit(){
  var c=document.getElementById('accSig'),ctx=c.getContext('2d'),draw=false,lx=0,ly=0;
  c.width=c.clientWidth;c.height=150;accDirty=false;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle='#1a2233';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';
  function pos(e){var r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
  c.onpointerdown=function(e){e.preventDefault();c.setPointerCapture(e.pointerId);draw=true;var p=pos(e);lx=p[0];ly=p[1]};
  c.onpointermove=function(e){if(!draw)return;e.preventDefault();var p=pos(e);
    ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p[0],p[1]);ctx.stroke();lx=p[0];ly=p[1];accDirty=true};
  c.onpointerup=c.onpointercancel=function(){draw=false};
}
function accClear(){
  var c=document.getElementById('accSig'),ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);accDirty=false;
}
function doAccept(){
  var name=document.getElementById('accName').value.trim();
  if(!name){showMsg('aMsg','err','Bitte Vor- und Nachnamen eintragen.');return}
  if(!accDirty){showMsg('aMsg','err','Bitte im Unterschriftsfeld unterschreiben.');return}
  fetch(API+'/portal/offer/'+OFFER+'/action',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({plz:PLZ,action:'accept',message:'',phone:'',name:name,
      signature:document.getElementById('accSig').toDataURL('image/png')})
  /* Die Erklärung des Servers durchreichen: Sonst sieht der Kunde bei jeder Absage nur
     "Senden fehlgeschlagen" und erfährt nie, woran es lag. */
  }).then(function(r){
    if(r.ok){loadOffer();return}
    return r.json().catch(function(){return null}).then(function(j){
      throw new Error((j&&j.error)||'Senden fehlgeschlagen – bitte erneut versuchen.');
    });
  }).catch(function(e){showMsg('aMsg','err',e.message||'Senden fehlgeschlagen – bitte erneut versuchen.')});
}
function decline(){
  var opt=document.getElementById('bandeOpt').checked;
  act('decline',document.getElementById('declMsg').value,null,function(){
    if(opt)sendAction('bande','Kunde wünscht DJ-Bande-Vorschläge (Einwilligung zur Datenweitergabe erteilt).');
  });
}
function act(kind,msg,phone,after){
  msg=msg!==undefined&&msg!==null?msg:(document.getElementById('cmt')?document.getElementById('cmt').value:'');
  phone=phone||(document.getElementById('cbPhone')?document.getElementById('cbPhone').value:'');
  if(kind==='comment'&&!msg.trim()){showMsg('aMsg','err','Bitte erst eine Nachricht eintragen.');return}
  if(kind==='callback'&&!phone.trim()){showMsg('aMsg','err','Bitte Telefonnummer angeben.');return}
  sendAction(kind,msg,phone,function(){
    if(kind==='accept'||kind==='decline'){loadOffer()}
    else showMsg('aMsg','ok',kind==='callback'?'Rückruf-Wunsch ist angekommen – ich melde mich!':'Nachricht ist angekommen – ich melde mich zeitnah!');
    if(after)after();
  });
}
function sendAction(kind,msg,phone,cb){
  fetch(API+'/portal/offer/'+OFFER+'/action',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({plz:PLZ,action:kind,message:msg||'',phone:phone||''})
  }).then(function(r){
    if(r.ok){if(cb)cb();return}
    return r.json().catch(function(){return null}).then(function(j){
      throw new Error((j&&j.error)||'Senden fehlgeschlagen – bitte erneut versuchen oder ruft mich direkt an.');
    });
  }).catch(function(e){showMsg('aMsg','err',e.message||'Senden fehlgeschlagen – bitte erneut versuchen oder ruft mich direkt an.')});
}

/* Wie docRowsHtml(), aber für die statische PDF-Ansicht: Erklärung steht direkt unter der
   Position statt in einem Hover-Tooltip. */
function docRowsHtmlPrint(items,f){
  var groups=groupDocItems(items);
  return groups.map(function(g,gi){
    var it=items[g.main],label=String(gi+1);
    if(!g.subs.length){
      var rab=Number(it.discount_value)?'<div style="font-size:10px;color:#666">Rabatt: −'+(it.discount_type==='eur'?euro(it.discount_value*f):Number(it.discount_value)+' %')+'</div>':'';
      return '<tr><td style="padding:6px;border-bottom:1px solid #ddd">'+label+'</td>'+
      '<td style="padding:6px;border-bottom:1px solid #ddd">'+esc(it.description)+rab+
      (it.note?'<div style="font-size:10px;color:#666;margin-top:2px">'+esc(it.note)+'</div>':'')+'</td>'+
      '<td style="padding:6px;border-bottom:1px solid #ddd;text-align:right;white-space:nowrap">'+Number(it.qty)+' '+esc(it.unit||'')+'</td>'+
      '<td style="padding:6px;border-bottom:1px solid #ddd;text-align:right;white-space:nowrap">'+euro(lineTotal(it)*f)+'</td></tr>';
    }
    var head='<tr><td style="padding:5px 6px 1px;font-weight:700">'+label+'</td>'+
      '<td style="padding:5px 6px 1px;font-weight:700">'+esc(it.description)+
      '<div style="font-size:9px;color:#666;font-weight:400">'+it.qty+' Stk. · Stückpreis '+euro(it.unit_price*f)+' / Tag</div></td>'+
      '<td style="padding:5px 6px 1px"></td><td style="padding:5px 6px 1px"></td></tr>';
    var subs=g.subs.map(function(si,k){
      var sit=items[si];
      return '<tr style="font-size:9px;color:#555"><td style="padding:0 6px 0 18px">'+label+'.'+String.fromCharCode(65+k)+'</td>'+
      '<td style="padding:0 6px">'+esc(sit.description)+
      (sit.note?'<div style="font-size:8px;color:#888">'+esc(sit.note)+'</div>':'')+'</td>'+
      '<td style="padding:0 6px;text-align:right;white-space:nowrap">'+subMenge(sit)+' '+esc(sit.unit||'')+'</td>'+
      '<td style="padding:0 6px;text-align:right;white-space:nowrap">'+euro(lineTotal(sit)*f)+'</td></tr>';
    }).join('');
    var foot='<tr><td></td><td colspan="2" style="padding:2px 6px 5px;text-align:right;font-weight:700;border-bottom:1px solid #ddd;font-size:10.5px">Gesamtsumme der Position</td>'+
      '<td style="padding:2px 6px 5px;text-align:right;font-weight:700;border-bottom:1px solid #ddd;font-size:10.5px">'+euro(groupTotal(items,g)*f)+'</td></tr>';
    return head+subs+foot;
  }).join('');
}

function mvPhoto(inp,side){
  var f=inp.files&&inp.files[0];if(!f)return;
  var img=new Image(),url=URL.createObjectURL(f);
  img.onload=function(){
    var mx=1600,sc=Math.min(1,mx/Math.max(img.width,img.height));
    var c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    var data=c.toDataURL('image/jpeg',0.85);
    if(side==='front')mvFront=data;else mvBack=data;
    var pv=document.getElementById(side==='front'?'pvFront':'pvBack');
    pv.src=data;pv.style.display='block';
  };
  img.onerror=function(){URL.revokeObjectURL(url);alert('Das Bild konnte nicht gelesen werden – bitte erneut versuchen.')};
  img.src=url;
}
function sigInit(){
  var c=document.getElementById('sigPad'),ctx=c.getContext('2d'),draw=false,lx=0,ly=0;
  c.width=c.clientWidth;c.height=170;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle='#1a2233';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';
  function pos(e){var r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
  c.addEventListener('pointerdown',function(e){e.preventDefault();c.setPointerCapture(e.pointerId);draw=true;var p=pos(e);lx=p[0];ly=p[1]});
  c.addEventListener('pointermove',function(e){if(!draw)return;e.preventDefault();var p=pos(e);
    ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p[0],p[1]);ctx.stroke();lx=p[0];ly=p[1];sigDirty=true});
  c.addEventListener('pointerup',function(){draw=false});
  c.addEventListener('pointercancel',function(){draw=false});
}
function sigClear(){
  var c=document.getElementById('sigPad'),ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);sigDirty=false;
}
function submitRental(){
  var err=function(t){var m=document.getElementById('mvMsg');m.style.display='block';m.textContent=t};
  if(!mvFront||!mvBack){err('Bitte beide Seiten des Ausweises fotografieren (Schritt 1).');return}
  if(!sigDirty){err('Bitte im Unterschriftsfeld unterschreiben.');return}
  var name=document.getElementById('mvName').value.trim();
  if(!name){err('Bitte Vor- und Nachnamen eintragen.');return}
  if(!document.getElementById('mvConsent').checked){err('Bitte der Speicherung der Ausweiskopie zustimmen.');return}
  document.getElementById('mvSend').disabled=true;
  fetch(API+'/portal/rental/'+MV+'/sign',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({plz:PLZ,signed_name:name,consent:true,
      signature:document.getElementById('sigPad').toDataURL('image/png'),
      id_front:mvFront,id_back:mvBack})})
    .then(function(r){return r.json().then(function(j){return {s:r.status,j:j}})})
    .then(function(res){
      if(res.s>=400)throw new Error(res.j.error||'Senden fehlgeschlagen.');
      app('<div class="card"><h1>Vertrag abgeschlossen</h1><p class="sub" style="margin-top:8px">Danke, '+esc(name)+'! Der Mietvertrag ist digital unterschrieben, die Ausweiskopie ist sicher gespeichert und wird nach der Rückgabe gelöscht. Bis bald bei der Übergabe!</p></div>');
    }).catch(function(e){document.getElementById('mvSend').disabled=false;err(e.message)});
}

/* ===== Veranstaltungsplaner =====
   Leere Felder darf der Kunde direkt speichern, bereits gesetzte nur als Änderung vorschlagen
   (siehe plan-suggest in api.php - Server entscheidet endgültig, das hier ist nur die Anzeige-
   Logik dafür). PLAN_STATE hält je Zeile Buchungs-ID/Feldpfad/Label/Art, damit die onclick-
   Handler nicht mit escapten Werten hantieren müssen. */
var PLAN_STATE={};
function fmtPlaylists(list){
  if(!Array.isArray(list)||!list.length)return '';
  return list.map(function(pl){
    var u=safeUrl(pl.url),txt=esc(pl.label||pl.url);
    return u?('<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+txt+'</a>'):txt;
  }).join('<br>');
}
function parsePlaylists(text){
  return (text||'').split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l){
    var m=l.split('|');
    if(m.length>1)return {label:m[0].trim(),url:m.slice(1).join('|').trim()};
    return {label:'Playlist',url:l};
  });
}
function playlistsToText(list){return (Array.isArray(list)?list:[]).map(function(pl){return (pl.label&&pl.label!=='Playlist'?pl.label+' | ':'')+pl.url}).join('\n')}
function fmtTimetable(list){
  if(!Array.isArray(list)||!list.length)return '';
  return '<table>'+list.map(function(t){return '<tr><td style="padding:2px 10px 2px 0;color:var(--mut);white-space:nowrap">'+esc(t.time||'')+'</td><td>'+esc(t.label||'')+'</td></tr>'}).join('')+'</table>';
}
function parseTimetable(text){
  return (text||'').split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l){
    var m=l.match(/^(\d{1,2}[:.]\d{2})\s+(.*)$/);
    return m?{time:m[1].replace('.',':'),label:m[2]}:{time:'',label:l};
  });
}
function timetableToText(list){return (Array.isArray(list)?list:[]).map(function(t){return (t.time?t.time+' ':'')+t.label}).join('\n')}
function planRow(bookingId,key,path,label,cfg){
  cfg=cfg||{};
  PLAN_STATE[key]={bookingId:bookingId,path:path,label:label,kind:cfg.kind||'text'};
  var display=cfg.displayHtml!=null?cfg.displayHtml:esc(String(cfg.val!=null?cfg.val:''));
  var editVal=cfg.editVal!=null?cfg.editVal:(cfg.val!=null?cfg.val:'');
  var box=cfg.multiline?('<textarea id="in_'+key+'" style="min-height:'+(cfg.rows||70)+'px">'+esc(editVal)+'</textarea>')
    :('<input id="in_'+key+'" value="'+esc(editVal)+'">');
  if(cfg.locked){
    return '<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)"><b>'+esc(label)+':</b> '+(cfg.empty?'<span class="sub">–</span>':display)+'</div>';
  }
  if(cfg.empty){
    return '<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)"><label style="margin:4px 0 2px">'+esc(label)+'</label>'+box+
      '<div style="margin-top:4px"><button class="btn" style="padding:6px 12px" onclick="planSubmit(\''+key+'\')">Speichern</button> <span id="ok_'+key+'" style="color:#9fd49f;font-size:13px;display:none">Gespeichert ✓</span></div></div>';
  }
  return '<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)"><b>'+esc(label)+':</b> '+display+
    ' <a onclick="planToggle(\''+key+'\')" style="cursor:pointer;font-size:13px">Änderung vorschlagen</a>'+
    '<div id="ed_'+key+'" hidden style="margin-top:4px">'+box+
    '<div style="margin-top:4px"><button class="btn" style="padding:6px 12px" onclick="planSubmit(\''+key+'\')">Vorschlag senden</button> <span id="ok_'+key+'" style="color:#9fd49f;font-size:13px;display:none">Vorschlag gesendet ✓</span></div></div></div>';
}
function planToggle(key){var el=document.getElementById('ed_'+key);el.hidden=!el.hidden}
function planSubmit(key){
  var st=PLAN_STATE[key];if(!st)return;
  var raw=document.getElementById('in_'+key).value;
  var val=raw;
  if(st.kind==='playlists')val=parsePlaylists(raw);
  else if(st.kind==='timetable')val=parseTimetable(raw);
  cfetch('portal/account/booking/'+st.bookingId+'/plan-suggest',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({field_path:st.path,field_label:st.label,value:val})})
    .then(function(r){return r.json().then(function(j){return {s:r.status,j:j}})})
    .then(function(res){
      if(res.s>=400){alert(res.j.error||'Das hat nicht geklappt – bitte später erneut versuchen.');return}
      var ok=document.getElementById('ok_'+key);
      if(ok){
        /* Hat der Server Zeilen verworfen (z.B. Links ohne https), gehört das dem Kunden
           gesagt - sonst denkt er, alles sei angekommen. */
        if(res.j.hinweis){ok.textContent=res.j.hinweis;ok.style.color='var(--acc)'}
        ok.style.display='';
      }
      setTimeout(function(){loadAccount()},res.j.hinweis?4000:1200);
    }).catch(function(){alert('Verbindungsfehler – bitte später erneut versuchen.')});
}
function planCard(b,i){
  var pl=b.event_plan||{},bas=pl.basics||{},inv=pl.invoice||{},mus=pl.music||{},locked=!!b.plan_locked;
  var k=function(s){return 'p'+i+'_'+s};
  var rows=
    planRow(b.id,k('partner'),'basics.partner_name','Partner/in',{val:bas.partner_name,empty:!bas.partner_name,locked:locked})+
    planRow(b.id,k('occasion'),'basics.occasion','Anlass',{val:bas.occasion,empty:!bas.occasion,locked:locked})+
    planRow(b.id,k('venue'),'basics.venue_name','Location',{val:bas.venue_name,empty:!bas.venue_name,locked:locked})+
    planRow(b.id,k('addr'),'basics.venue_address','Adresse',{val:bas.venue_address,empty:!bas.venue_address,locked:locked})+
    planRow(b.id,k('guests'),'basics.guest_count','Gästezahl',{val:bas.guest_count,empty:bas.guest_count==null,locked:locked})+
    planRow(b.id,k('arrival'),'basics.arrival_time','Ankunft Gäste',{val:bas.arrival_time,empty:!bas.arrival_time,locked:locked})+
    planRow(b.id,k('vcontact'),'basics.venue_contact_name','Ansprechpartner Location',{val:bas.venue_contact_name,empty:!bas.venue_contact_name,locked:locked})+
    planRow(b.id,k('vphone'),'basics.venue_contact_phone','Telefon Location',{val:bas.venue_contact_phone,empty:!bas.venue_contact_phone,locked:locked})+
    planRow(b.id,k('setup'),'basics.setup_from','Aufbau ab',{val:bas.setup_from,empty:!bas.setup_from,locked:locked})+
    planRow(b.id,k('teardown'),'basics.teardown_until','Abbau bis',{val:bas.teardown_until,empty:!bas.teardown_until,locked:locked})+
    planRow(b.id,k('invcompany'),'invoice.company','Firma (Rechnung)',{val:inv.company,empty:!inv.company,locked:locked})+
    planRow(b.id,k('invname'),'invoice.name','Name (Rechnung)',{val:inv.name,empty:!inv.name,locked:locked})+
    planRow(b.id,k('invstreet'),'invoice.street','Straße',{val:inv.street,empty:!inv.street,locked:locked})+
    planRow(b.id,k('invzip'),'invoice.zip_city','PLZ Ort',{val:inv.zip_city,empty:!inv.zip_city,locked:locked})+
    planRow(b.id,k('musts'),'music.musts','Musik-Musts',{val:mus.musts,empty:!mus.musts,locked:locked})+
    planRow(b.id,k('nogos'),'music.nogos','No-Gos',{val:mus.nogos,empty:!mus.nogos,locked:locked})+
    planRow(b.id,k('playlists'),'music.playlists','Spotify-Playlists',{
      empty:!(Array.isArray(mus.playlists)&&mus.playlists.length),locked:locked,multiline:true,rows:60,kind:'playlists',
      displayHtml:fmtPlaylists(mus.playlists),editVal:playlistsToText(mus.playlists)})+
    planRow(b.id,k('timetable'),'timetable','Ablaufplan',{
      empty:!(Array.isArray(pl.timetable)&&pl.timetable.length),locked:locked,multiline:true,rows:90,kind:'timetable',
      displayHtml:fmtTimetable(pl.timetable),editVal:timetableToText(pl.timetable)})+
    planRow(b.id,k('freitext'),'freitext','Freitext',{val:pl.freitext,empty:!pl.freitext,locked:locked,multiline:true,rows:70});
  return '<div class="card" style="margin-top:14px"><h2 style="font-size:17px">Veranstaltungsplaner <span style="color:var(--mut);font-size:13px;font-weight:400">· '+esc(b.title||'Termin')+'</span></h2>'+
    '<p class="sub" style="font-size:13px;margin:6px 0 10px">Du musst hier nichts ausfüllen – ich kümmere mich sonst darum und melde mich, wenn ich Fragen habe. Es hilft aber, Missverständnisse zu vermeiden, wenn du schon einträgst, was du weißt.</p>'+
    (locked?'<p class="msg err" style="display:block;font-size:13px">Der Ablaufplan ist jetzt final – Änderungswünsche bitte direkt mit mir klären.</p>':'')+
    rows+'</div>';
}
function renderAccount(){
  var me=ME;
  var docs=me.documents.map(function(d){
    return '<div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap">'+
    '<div><b>'+(TYPE_LABEL[d.doc_type]||d.doc_type)+' '+esc(d.number)+'</b> <span style="color:var(--mut);font-size:13px">· '+dt(d.doc_date)+' · '+d.status+'</span></div>'+
    '<a href="?a='+d.token+'">Ansehen / PDF →</a></div>';
  }).join('')||'<p class="sub">Noch keine Unterlagen.</p>';
  var rentals=(me.rentals||[]).map(function(r){
    return '<div style="padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)"><b>Mietvertrag</b> <span style="color:var(--mut);font-size:13px">· Termin '+dt(r.event_date)+' · '+(r.status==='unterschrieben'?'unterschrieben ✓':'offen')+'</span> &nbsp;<a href="?mv='+r.token+'">Öffnen →</a></div>';
  }).join('');
  var forms=(me.forms||[]).map(function(f){
    return '<div style="padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)"><b>'+esc(f.title)+'</b> <span style="color:var(--mut);font-size:13px">· '+(f.status==='beantwortet'?'beantwortet am '+dt(f.submitted_at):'noch offen')+'</span> &nbsp;<a href="?f='+f.token+'">'+(f.status==='beantwortet'?'Ansehen':'Jetzt ausfüllen')+' →</a></div>';
  }).join('');
  var books=me.bookings.map(function(b,i){
    var n=b.notes||{};
    /* Das alte Freitext-Feld fragt dasselbe ab wie der Veranstaltungsplaner darüber
       (Ablaufplan, Musikwünsche, Sonstiges). Zwei Kästen mit denselben Fragen verwirren -
       deshalb erscheint dieser Kasten nur noch, wenn dort schon etwas drinsteht. */
    var hatNotizen=!!(n.schedule||n.music||n.agreements);
    if(!hatNotizen)return planCard(b,i);
    return planCard(b,i)+
    '<div class="card" style="margin-top:14px"><h2 style="font-size:17px">Ältere Notizen <span style="color:var(--mut);font-size:13px;font-weight:400">· '+esc(b.title||'Termin')+'</span></h2>'+
    '<p class="sub" style="font-size:13px;margin:6px 0 4px">Das hast du eingetragen, bevor es den Planer gab. Ich lese beides – du kannst es hier stehen lassen oder oben in den Planer übertragen.</p>'+
    '<label for="nS'+i+'">Programmablauf (Zeiten, Reden, Programmpunkte)</label><textarea id="nS'+i+'" style="min-height:80px" placeholder="z. B. 18:00 Empfang · 19:00 Essen · 20:30 Rede Chef · 21:00 Party …">'+esc(n.schedule||'')+'</textarea>'+
    '<label for="nM'+i+'">Musikwünsche &amp; No-Gos</label><textarea id="nM'+i+'" style="min-height:80px" placeholder="Wünsche, Lieblingslieder, was auf keinen Fall laufen darf …">'+esc(n.music||'')+'</textarea>'+
    '<label for="nA'+i+'">Vereinbarungen &amp; Sonstiges</label><textarea id="nA'+i+'" style="min-height:60px" placeholder="Was wir besprochen haben, Ansprechpartner vor Ort, Besonderheiten …">'+esc(n.agreements||'')+'</textarea>'+
    '<div style="margin-top:12px;display:flex;gap:12px;align-items:center"><button class="btn" onclick="saveNotes('+i+')">Speichern</button><span id="nOk'+i+'" style="color:#9fd49f;font-size:13px;display:none">Gespeichert ✓</span></div></div>';
  }).join('');
  var files=(me.files||[]).map(function(f){
    return '<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)">'+
    '<div>'+(f.kind==='foto'?'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>':'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>')+' '+esc(f.name)+' <span style="color:var(--mut);font-size:12px">('+Math.max(1,Math.round(f.size/1024))+' KB)</span></div>'+
    '<div><a onclick="openFile(\''+f.id+'\')" style="cursor:pointer">Öffnen</a> &nbsp;<a onclick="delFile(\''+f.id+'\')" style="cursor:pointer;color:#e0a0a0">Löschen</a></div></div>';
  }).join('')||'<p class="sub" style="font-size:13px">Noch keine Dateien – ladet gern Fotos eurer Location oder Dokumente hoch.</p>';
  app('<div class="card"><div class="kicker">Dein Kunden-Backoffice</div><h1>Hallo, '+esc(me.customer.name)+'!</h1>'+
    '<p class="sub">Hier findet ihr alle Unterlagen und könnt alles für eure Termine pflegen. <a onclick="logout()" style="cursor:pointer">Abmelden</a></p></div>'+
    '<div class="card"><h2><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> Meine Unterlagen</h2>'+docs+rentals+'</div>'+
    (forms?'<div class="card"><h2><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> Fragebögen</h2>'+forms+'</div>':'')+
    books+
    '<div class="card"><h2><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Fotos &amp; Dokumente</h2>'+
    '<p class="sub" style="font-size:13px">Locationfotos helfen mir enorm bei der Planung – Raum, Bühne, Stromanschlüsse, Parkplatz. Auch Dokumente (z. B. Ablaufpläne als PDF) sind willkommen.</p>'+
    '<div id="fileList">'+files+'</div>'+
    '<div style="margin-top:12px"><input type="file" id="fUp" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.csv" onchange="uploadFiles(this)">'+
    '<div class="msg" id="fUpMsg" style="display:none;margin-top:8px"></div></div></div>');
}
function saveNotes(i){
  var b=ME.bookings[i];
  cfetch('portal/account/booking/'+b.id+'/notes',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({schedule:document.getElementById('nS'+i).value,music:document.getElementById('nM'+i).value,agreements:document.getElementById('nA'+i).value})})
    .then(function(r){if(!r.ok)throw new Error();
      var ok=document.getElementById('nOk'+i);ok.style.display='';setTimeout(function(){ok.style.display='none'},2500);
    }).catch(function(){alert('Speichern fehlgeschlagen – bitte erneut versuchen.')});
}
function uploadFiles(inp){
  var files=Array.from(inp.files||[]);inp.value='';
  var m=document.getElementById('fUpMsg');
  var chain=Promise.resolve();
  files.forEach(function(f){
    chain=chain.then(function(){
      return (f.type.indexOf('image/')===0?shrinkImage(f):Promise.resolve(f)).then(function(blob){
        return cfetch('portal/account/upload?name='+encodeURIComponent(f.name),{method:'POST',body:blob})
          .then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error)});
      });
    });
  });
  chain.then(function(){m.style.display='block';m.className='msg ok';m.textContent='Hochgeladen ✓';loadAccount()})
    .catch(function(e){m.style.display='block';m.className='msg err';m.textContent=e.message||'Upload fehlgeschlagen.'});
}
function shrinkImage(f){
  return new Promise(function(res){
    var img=new Image(),url=URL.createObjectURL(f);
    img.onload=function(){
      var mx=2000,sc=Math.min(1,mx/Math.max(img.width,img.height));
      var c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){res(b||f)},'image/jpeg',0.87);
    };
    img.onerror=function(){URL.revokeObjectURL(url);res(f)};
    img.src=url;
  });
}
function openFile(id){
  cfetch('portal/account/file/'+id).then(function(r){if(!r.ok)throw new Error();return r.blob()})
    .then(function(b){window.open(URL.createObjectURL(b),'_blank')}).catch(function(){alert('Datei konnte nicht geladen werden.')});
}
function delFile(id){
  if(!confirm('Datei wirklich löschen?'))return;
  cfetch('portal/account/file/'+id,{method:'DELETE'}).then(function(){loadAccount()});
}

/* Ein abgeschnittener Link (z.B. "portal.html?a=" ohne Kennung) landete bisher wortlos
   auf der Anmeldemaske - der Kunde sucht dann den Fehler bei sich. */
var LEER=['a','f','mv','einladung'].filter(function(k){return qs.has(k)&&!qs.get(k)});
if(OFFER)loadOffer();
else if(FORM)loadForm();
else if(MV)loadRental();
else if(INVITE)renderSetPw();
else if(LEER.length)
  app('<div class="card"><h1>Der Link ist unvollständig</h1>'+
    '<p class="sub">Da fehlt das Stück hinter dem Gleichheitszeichen – beim Kopieren aus einer E-Mail geht das leicht verloren. '+
    'Kopier den Link bitte noch einmal komplett, oder melde dich kurz bei mir: '+
    '<a href="tel:+4915236439373">01523 6439373</a>.</p>'+
    '<p class="sub" style="margin-top:14px">Du hast ein Kundenkonto? <a href="portal.html">Hier geht es zur Anmeldung.</a></p></div>');
else if(CTOK)loadAccount();
else renderLogin();
</script>
